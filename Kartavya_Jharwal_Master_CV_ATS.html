d food-contact risk."]},{"name":"Crestara Smart-Room Digital Twin and Privacy-First IoT Platform","description":"Venture design case: hotel-room digital twin expanded into a privacy-first modular IoT concept with PMS integration and tiered deployment economics.","highlights":["Built a hotel-room digital twin from the ground up, linking occupancy, energy use, guest controls, maintenance demand, and room-level cost into a decision model.","Expanded the prototype into Crestara, integrating PMS, networking, television, and room controls while processing guest data on site.","Engineered privacy into the architecture through checkout-triggered deletion, guest-requested erasure, transparent audits, local processing, and removable devices.","Extended the digital twin into an underwriting model testing capital cost, occupancy, energy, maintenance, subscription revenue, and payback across deployment scenarios.","Modelled a tiered launch with GBP 65,000 initial capital, hardware priced from GBP 329 to GBP 999, recurring subscriptions, and GBP 800 annual maintenance contracts."]},{"name":"Global Development and Climate Hypothesis Testing","description":"Sainen was an independent research case testing economic development against emissions and net-zero policy commitments.","highlights":["Merged GDP, emissions, and net-zero datasets into 10,199 country-year observations, then built a stratified 1,800-record sample spanning 191 countries.","Tested 2 policy hypotheses with correlation, ANOVA, and chi-square methods, finding significant GDP associations with emissions and legal climate commitments at p < 0.001.","Translated the results into a supplier-risk framework for carbon-border exposure, separating 3 market categories: legally committed, policy-only, and uncommitted."]},{"name":"Noritake Hospitality Tableware Positioning Strategy","description":"Independent strategy case repositioning Noritake's tabletop capability for Asian hospitality partnerships.","highlights":["Mapped Nor ital-allocation case evaluating a USD 100.76 billion Walmart automation, store technology, and EV infrastructure programme.","highlights":["Co-built a capital-budgeting model for a USD 100.76 billion programme spanning automated fulfilment, store technology, and EV infrastructure.","Calculated a 7.8% WACC, USD 164.05 billion NPV, 15.7% IRR, 2.83 profitability index, and discounted payback under 9 months using base-case operating and financing assumptions.","Stress-tested the investment across plus or minus 20% revenue, WACC, and cost scenarios and translated the outputs into capital-allocation recommendations."]},{"name":"Walmart Pfand Circular Retail Strategy","description":"Team future-proofing case for Walmart reverse-vending, rewards, and accessible store operations.","highlights":["Designed a Walmart+ reverse-vending roadmap with accessible kiosk UX, instant rewards, fraud detection, and a modelled scale phase covering more than 2,000 stores.","Set pilot targets of 50% fewer interface errors, 40% less manual intervention, 15% higher satisfaction, and 25% higher effective kiosk sales."]},{"name":"Samsung and Huawei Strategic Resilience Analysis","description":"Independent strategy case comparing Samsung and Huawei on technology, ESG, geopolitical exposure, and supply-chain resilience.","highlights":["Compared Samsung and Huawei using PitchBook and company data, connecting semiconductor depth and ESG commitments to geopolitical exposure and supply-chain resilience.","Built a risk register and opportunity map linking 3 nm manufacturing, USD 18.8 billion R&D, sanctions, circularity, and domestic sourcing to future market access."]},{"name":"Personal Brand and Digital Presence","description":"Raconteur is a personal narrative, brand, and publishing system spanning major channels and owned web properties.","highlights":["Unified positioning across LinkedIn, Instagram, and kartavya.tech through a shared visual identity, headline, and content architecture.","Turned the owned website into the source of truth for projects and long-form evidence, giving shorter social profiles a consistent path back to substantive work."]}],"education":[{"institution":"Hult International Business School","school":"Undergraduate Business School","url":"https://www.hult.edu/","location":"London, UK","area":"Entrepreneurship and Design","studyType":"Bachelor of Business Administration","date":"Expected May 2027","score":"3.76/4.00 | First Honors (UK First-class standing)","summary":"","honors":["Dean's List for consecutive terms","Global campus winner, SDG-focused Social Impact Challenge"],"courses":["Acting 101 Voice, Body, and Character","Business Strategy","Start-up Challenge","Social Impact Challenge","Future Proofing Challenge","Corporate Entrepreneurship","Creativity","Design 1","Design Thinking in Practice","Fundamentals of Business Analytics","Building Next-Generation Startups","Design Thinking in Web Design"]}],"additional":{"skillMap":[{"name":"Backend and APIs","label":"Backend","level":"Advanced","keywords":["Python","Flask","Django","FastAPI","JavaScript","HTML/CSS","SQL","Git/GitHub"]},{"name":"Data and Databases","label":"Data","level":"Advanced","keywords":["MySQL","PostgreSQL","SQLite","Redis","Excel","OpenPyXL","Power BI"]},{"name":"AI and ML","label":"AI / ML","level":"Intermediate to Advanced","keywords":["TensorFlow","PyTorch","Whisper","speech-model fine-tuning","real-time AI voice systems"]},{"name":"Systems and DevOps","label":"Systems","level":"Advanced","keywords":["Linux Systems Administration","Docker","network routing","firewall traversal","SSH deployment"]},{"name":"Product, Design, and Spatial Tools","label":"Product / Design","level":"Intermediate","keywords":["Figma","Snaptrude","product strategy","systems design","service design"]},{"name":"Founder and Venture Building","label":"Founder / Venture","level":"Applied","keywords":["Founder storytelling","GTM playbooks","MVP development","Python","Native web development"]},
